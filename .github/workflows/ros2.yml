name: ROS 2 bridge

on:
  push:
    paths: ['ros2/**', '.github/workflows/ros2.yml']
  pull_request:
    paths: ['ros2/**', '.github/workflows/ros2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol regression tests (no ROS installation)
        working-directory: ros2/dcaron_bridge
        run: python -m unittest discover -s test -p test_protocol.py -v

  ros-runtime:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install test and transport dependencies
        run: |
          apt-get update
          apt-get install -y python3-serial python3-pytest python3-colcon-common-extensions
      - name: Build installed package and verify real ROS topics
        shell: bash
        working-directory: ros2
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -c 'import rclpy, serial, pytest; from tf2_ros import TransformBroadcaster'
          colcon build --merge-install --base-paths dcaron_bridge --packages-select dcaron_bridge
          source install/setup.bash
          ros2 pkg executables dcaron_bridge
          ros2 launch dcaron_bridge bridge.launch.py --show-args
          colcon test --merge-install --packages-select dcaron_bridge --event-handlers console_direct+
          colcon test-result --verbose
